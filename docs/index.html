<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HitoNuri — Palm puzzles</title>
  <link rel="stylesheet" href="hitonuri.css">
</head>
<body>
  <main class="palm" aria-label="HitoNuri Palm puzzle game">
    <div class="brand">HitoNuri • Palm OS</div>
    <section class="bezel">
      <div class="screen">
        <div class="top"><span id="title">HitoNuri</span><span id="clock"></span></div>
        <div id="board" class="board" aria-label="Puzzle grid"></div>
        <div id="message" class="message" aria-live="polite"></div>
        <div class="controls">
          <button class="btn" id="restart" title="Restart">&lt;</button>
          <button class="btn" id="next">Next</button>
          <button class="btn" id="switch">Hitori</button>
          <button class="btn" id="solve" title="Show solution">:)</button>
          <button class="btn" id="helpBtn" title="Rules">?</button>
        </div>
      </div>
    </section>
    <div class="silk"><span class="abc">a b c</span><span class="nums">1 2 3</span></div>
    <div class="hardware">
      <button class="round" id="prev" title="Previous puzzle">◀</button>
      <button class="round" id="restart2" title="Restart">↺</button>
      <button class="rocker" id="next2" title="Next puzzle">▲<br>▼</button>
      <button class="round" id="helpBtn2" title="Rules">?</button>
    </div>
  </main>
  <div id="legacy" class="legacy" role="dialog" aria-modal="true" aria-label="Original HitoNuri page">
    <div class="legacy-window">
      <button class="btn legacy-close" id="closeLegacy">Close legacy page</button>
      <iframe src="index-old.html" title="Original HitoNuri information page"></iframe>
    </div>
  </div>
  <script src="hitonuri.js"></script>
</body>
</html>
